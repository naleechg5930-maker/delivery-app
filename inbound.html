<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>LUNA&SOL 입고 검수</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#FFFFFF; --panel:#F5F6FB; --panel2:#ECEEF7; --line:#DCE0EE;
    --text:#171B3D; --sub:#6C7293;
    --ok:#16A34A; --ok-dim:#DCFCE7; --err:#DC2626; --err-dim:#FEE2E2;
    --accent:#FFB200; --accent-ink:#1A1300; --navy:#161D65;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; }
  body{ display:flex; flex-direction:column; padding:18px 22px 28px; gap:14px; min-height:100vh; }

  .topbar{
    background:var(--navy); border-radius:14px; padding:14px 20px; display:flex; align-items:center; gap:14px;
    --panel2:#232B76; --line:#323B8C; --text:#ECEEFB; --sub:#AEB4E0; --btn-hover:#2C3480; color:var(--text);
  }
  .topbar .brand{ font-weight:900; font-size:20px; }
  .topbar .brand b{ color:var(--accent); }
  .topbar .subtitle{ font-size:12.5px; color:var(--sub); }
  .toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-left:auto; }

  button, .file-btn{
    background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:10px;
    padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  button:hover, .file-btn:hover{ background:var(--btn-hover, #E4E7F5); }
  input[type=file]{ display:none; }

  .top-controls{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 18px;
    display:flex; flex-direction:column; gap:10px;
  }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .row label{ font-size:12.5px; color:var(--sub); font-weight:700; }
  .row input[type=text]{
    flex:1; min-width:160px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px;
    background:#fff; color:var(--text);
  }
  #orderInfo{ font-size:13px; color:var(--sub); }
  .status-span{ font-size:12.5px; color:var(--sub); }
  .status-span.ok{ color:var(--ok); font-weight:700; }

  .main-grid{ display:grid; grid-template-columns:1.1fr 1.6fr; gap:16px; }
  @media (max-width:980px){ .main-grid{ grid-template-columns:1fr; } }

  .scan-panel{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .scan-input-wrap label{ font-size:12.5px; color:var(--sub); font-weight:600; display:block; margin-bottom:6px; }
  #scanInput{
    width:100%; font-family:Consolas,monospace; font-size:22px; font-weight:700;
    background:#fff; border:2px solid var(--accent); border-radius:10px; padding:14px 16px; color:var(--text);
    outline:none; letter-spacing:1px;
  }
  #scanInput::placeholder{ color:#9AA0BE; font-weight:500; }

  .log-panel{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
  .log-panel .title{ font-size:12.5px; color:var(--sub); font-weight:700; margin-bottom:6px; }
  #logList{ max-height:120px; overflow-y:auto; font-size:12.5px; font-family:Consolas,monospace; }
  #logList div{ padding:3px 0; border-bottom:1px dashed var(--line); }
  #logList div.err{ color:var(--err); }
  #logList div.ok{ color:var(--ok); }

  .status-banner{
    border-radius:14px; padding:34px 20px; text-align:center; font-weight:800; font-size:18px;
    background:var(--panel2); color:var(--sub); transition:background .15s;
  }
  .status-banner.ok{ background:var(--ok-dim); color:#065F2C; }
  .status-banner.err{ background:var(--err-dim); color:#7F1D1D; }
  .status-banner .icon{ font-size:40px; display:block; margin-bottom:8px; }
  .status-banner .detail{ font-size:13px; font-weight:600; margin-top:6px; color:inherit; opacity:.85; }

  .mini-stats{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .mini-stats .card{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; text-align:center; }
  .mini-stats .card b{ font-size:22px; display:block; }
  .mini-stats .card span{ font-size:11.5px; color:var(--sub); }

  .split-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .table-panel{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; flex:1 1 300px; min-width:280px; height:340px; max-height:340px; display:flex; flex-direction:column; }
  .table-head{ display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:14px; margin-bottom:8px; }
  .table-head .count{ font-size:12px; color:var(--sub); font-weight:600; }
  .table-scroll{ overflow-y:auto; flex:1; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ text-align:left; color:var(--sub); font-weight:700; padding:4px 6px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); }
  td{ padding:5px 6px; border-bottom:1px solid var(--line); }
  .badge{ padding:2px 8px; border-radius:20px; font-size:11px; font-weight:800; }
  .badge.wait{ background:var(--panel2); color:var(--sub); }
  .badge.done{ background:var(--ok-dim); color:#065F2C; }
  .badge.over{ background:var(--err-dim); color:#7F1D1D; }

  .overlay{ display:none; position:fixed; inset:0; background:rgba(10,14,30,0.55); align-items:center; justify-content:center; z-index:50; }
  .overlay.show{ display:flex; }
  .complete-card, .paste-card{ background:#161D65; color:#ECEEFB; border-radius:18px; padding:28px 32px; max-width:420px; text-align:center;
    --text:#ECEEFB; --sub:#AEB4E0; --line:#2B3178; --panel2:#171C4C; }
  .complete-card .big-icon{ font-size:48px; }
  .complete-card h2{ margin:6px 0; }
  .complete-meta{ text-align:left; background:var(--panel2); border-radius:10px; padding:12px 16px; margin:14px 0; font-size:13px; }
  .complete-meta div{ display:flex; justify-content:space-between; padding:3px 0; }
  .meta-label{ color:var(--sub); }
  #completeCaptureArea{ background:#161D65; padding:6px; border-radius:14px; }
  .complete-card button{ background:var(--accent); color:var(--accent-ink); font-weight:800; padding:10px 24px; margin-top:6px; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="brand">LUNA<b>&</b>SOL</div>
    <div class="subtitle">입고 검수 프로그램</div>
  </div>
  <div class="toolbar">
    <label class="file-btn" for="fileInput">📂 발주서 엑셀 업로드</label>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
    <button id="soundToggle">🔊 소리 켜짐</button>
    <button id="resetBtn">↺ 검수 초기화</button>
  </div>
</div>

<div class="top-controls">
  <div class="row">
    <label>공급처</label>
    <input type="text" id="supplierInput" placeholder="발주서 업로드 시 자동 입력">
    <label>전표번호</label>
    <input type="text" id="documentKeyInput" placeholder="자동 입력" style="max-width:180px;">
  </div>
  <div class="row">
    <label>구글시트 연동</label>
    <input type="text" id="gasUrlInput" placeholder="Apps Script 웹앱 URL (검수프로그램과 동일한 주소 사용 가능)">
    <button id="gasConnectBtn">🔗 연결</button>
    <span class="status-span" id="gasStatus">미연동 · 연동 안 해도 검수는 그대로 가능(기록만 안 됨)</span>
  </div>
  <div id="orderInfo"></div>
</div>

<div class="main-grid">
  <div class="scan-panel">
    <div class="scan-input-wrap">
      <label>바코드 스캔 입력 (스캐너로 찍으면 자동 입력됩니다)</label>
      <input type="text" id="scanInput" placeholder="여기를 클릭 후 바코드를 스캔하세요" autocomplete="off">
    </div>
    <div class="log-panel">
      <div class="title">스캔 로그</div>
      <div id="logList"></div>
    </div>
    <div class="status-banner" id="statusBanner">
      <span class="icon">📦</span>
      스캔 대기중
      <div class="detail" id="statusDetail"></div>
    </div>
    <div class="mini-stats">
      <div class="card"><b id="okCountEl" style="color:var(--ok);">0</b><span>정상입고</span></div>
      <div class="card"><b id="errCountEl" style="color:var(--err);">0</b><span>오차입고</span></div>
      <div class="card"><b id="doneCountEl">0/0</b><span>완료 품번</span></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;">
    <div class="split-row">
      <div class="table-panel">
        <div class="table-head">⏳ 대기중 / 진행중 <span class="count" id="waitCount">0품목</span></div>
        <div class="table-scroll">
          <table>
            <thead><tr><th>품번(바코드)</th><th>품목명</th><th>규격/사이즈</th><th>발주</th><th>입고</th><th>상태</th></tr></thead>
            <tbody id="waitTbody"></tbody>
          </table>
        </div>
      </div>
      <div class="table-panel">
        <div class="table-head">✅ 완료 <span class="count" id="doneTableCount">0품목</span></div>
        <div class="table-scroll">
          <table>
            <thead><tr><th>품번(바코드)</th><th>품목명</th><th>규격/사이즈</th><th>발주</th><th>입고</th><th>상태</th></tr></thead>
            <tbody id="doneTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="complete-card">
    <div id="completeCaptureArea">
      <div class="big-icon">✅</div>
      <h2>입고 검수 완료</h2>
      <p id="completeSummary">전 품목 입고 확인이 완료되었습니다.</p>
      <div class="complete-meta">
        <div><span class="meta-label">공급처</span><span id="completeSupplier">-</span></div>
        <div><span class="meta-label">완료 시각</span><span id="completeTime">-</span></div>
      </div>
    </div>
    <button id="closeOverlay">확인</button>
  </div>
</div>

<script>
/* ===================== 상태 ===================== */
let items = [];        // {code, name, spec, orderQty, scannedQty}
let codeIndex = {};
let okCount = 0, errCount = 0;
let errLogEntries = [];
let inspectionStartTime = null;
let currentDocumentKey = '';
let soundOn = true;
let gasWebhookUrl = '';

const scanInput = document.getElementById('scanInput');
const logList = document.getElementById('logList');

/* ===================== 사운드 ===================== */
let audioCtx = null, masterGain = null, compressor = null;
function ensureAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  compressor = audioCtx.createDynamicsCompressor();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 1.3;
  compressor.connect(masterGain);
  masterGain.connect(audioCtx.destination);
}
function beep(freq, duration, type='sine', delay=0, gain=0.28){
  if(!soundOn) return;
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  g.gain.value = gain;
  osc.connect(g); g.connect(compressor);
  const t0 = audioCtx.currentTime + delay;
  osc.start(t0);
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.stop(t0 + duration + 0.02);
}
function playOkSound(){ beep(880,0.09,'sine',0); beep(1320,0.12,'sine',0.08); }
function playErrSound(){ beep(280,0.5,'sawtooth',0,0.3); beep(820,0.4,'sawtooth',0.15,0.28); }
function playCompleteSound(){ beep(660,0.12,'triangle',0); beep(880,0.12,'triangle',0.1); beep(1320,0.2,'triangle',0.2); }
function speakKorean(text){
  if(!soundOn || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; u.rate = 1.05;
  window.speechSynthesis.speak(u);
}

/* ===================== IndexedDB 공용 저장소 ===================== */
const FS_DB_NAME = 'inbound_fs_db';
const FS_STORE = 'handles';
function openHandleDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(FS_DB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(FS_STORE);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await openHandleDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(FS_STORE, 'readwrite');
    tx.objectStore(FS_STORE).put(val, key);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbGet(key){
  const db = await openHandleDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(FS_STORE, 'readonly');
    const req = tx.objectStore(FS_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}

/* ===================== 유틸 ===================== */
function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function parseQtyValue(v){
  if(v == null) return NaN;
  const m = String(v).match(/-?[\d.]+/);
  return m ? parseFloat(m[0]) : NaN;
}
function sanitizeFilename(s){
  return String(s || '').replace(/[\\/:*?"<>|]/g, '_').trim() || '업체명미상';
}
function nowStamp(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}
function splitNameSpec(raw){
  const s = String(raw || '').trim();
  const m = s.match(/^(.*?)\s*\[([^\]]+)\]\s*$/);
  if(m) return { name: m[1].trim(), spec: m[2].trim() };
  return { name: s, spec: '' };
}

/* ===================== 품목 로딩 ===================== */
function loadItems(rawList){
  items = rawList.map(it => ({
    code: String(it.code).trim(),
    name: it.name || '',
    spec: it.spec || '',
    orderQty: Number(it.qty) || 0,
    scannedQty: 0,
  })).filter(it => it.code && it.orderQty > 0);
  codeIndex = {};
  items.forEach(it => codeIndex[it.code.toUpperCase()] = it);
  okCount = 0; errCount = 0; errLogEntries = [];
  logList.innerHTML = '';
  inspectionStartTime = new Date();
  renderTables();
  updateMiniStats();
  showBanner('idle', '스캔 대기중', '', '📦');
}

function renderTables(){
  const waitTbody = document.getElementById('waitTbody');
  const doneTbody = document.getElementById('doneTbody');
  const waitRows = [], doneRows = [];
  items.forEach(it => {
    const done = it.scannedQty >= it.orderQty;
    const over = it.scannedQty > it.orderQty;
    const badge = over ? `<span class="badge over">초과</span>` : done ? `<span class="badge done">완료</span>` : `<span class="badge wait">대기</span>`;
    const rowHtml = `<tr><td>${escapeHtml(it.code)}</td><td>${escapeHtml(it.name)}</td><td>${escapeHtml(it.spec)}</td><td>${it.orderQty}</td><td>${it.scannedQty}</td><td>${badge}</td></tr>`;
    (done ? doneRows : waitRows).push(rowHtml);
  });
  waitTbody.innerHTML = waitRows.join('');
  doneTbody.innerHTML = doneRows.join('');
  document.getElementById('waitCount').textContent = waitRows.length + '품목';
  document.getElementById('doneTableCount').textContent = doneRows.length + '품목';
}

function updateMiniStats(){
  document.getElementById('okCountEl').textContent = okCount;
  document.getElementById('errCountEl').textContent = errCount;
  const doneCnt = items.filter(it => it.scannedQty >= it.orderQty).length;
  document.getElementById('doneCountEl').textContent = `${doneCnt}/${items.length}`;
}

function showBanner(state, title, detail, icon){
  const el = document.getElementById('statusBanner');
  el.className = 'status-banner' + (state === 'ok' ? ' ok' : state === 'err' ? ' err' : '');
  el.innerHTML = `<span class="icon">${icon || '📦'}</span>${escapeHtml(title)}<div class="detail" id="statusDetail">${escapeHtml(detail || '')}</div>`;
}

function addLog(timeStr, code, ok, note){
  const div = document.createElement('div');
  div.className = ok ? 'ok' : 'err';
  div.textContent = `[${timeStr}] ${code} - ${note}`;
  logList.insertBefore(div, logList.firstChild);
}

/* ===================== 스캔 처리 (박스/마대 = 11자리 품번 + 수량 접미 지원) ===================== */
const PRODUCT_CODE_LEN = 11;

function processScan(rawCode){
  const scannedRaw = String(rawCode || '').trim().toUpperCase();
  if(!scannedRaw) return;
  const timeStr = new Date().toLocaleTimeString('ko-KR', {hour12:false});

  let item = codeIndex[scannedRaw];
  let bulkQty = 1;
  let displayCode = scannedRaw;

  if(!item && scannedRaw.length > PRODUCT_CODE_LEN){
    const possibleCode = scannedRaw.slice(0, PRODUCT_CODE_LEN);
    const qtyPart = scannedRaw.slice(PRODUCT_CODE_LEN).replace(/\D/g, '');
    if(codeIndex[possibleCode] && qtyPart){
      item = codeIndex[possibleCode];
      bulkQty = parseInt(qtyPart, 10) || 1;
      displayCode = possibleCode;
    }
  }

  if(!item){
    errCount++;
    showBanner('err', '등록에 없는 품번', scannedRaw, '⚠️');
    addLog(timeStr, scannedRaw, false, '발주서에 없는 품번');
    playErrSound();
    updateMiniStats();
    return;
  }

  const remaining = item.orderQty - item.scannedQty;

  if(bulkQty <= remaining){
    item.scannedQty += bulkQty;
    okCount += bulkQty;
    const done = item.scannedQty >= item.orderQty;
    showBanner('ok', '정상입고', `${item.name} / ${item.spec}  (${item.scannedQty}/${item.orderQty})`, '✅');
    addLog(timeStr, displayCode, true, done ? '해당 품번 완료' : `${item.scannedQty}/${item.orderQty}`);
    playOkSound();
  } else {
    const overBy = bulkQty - remaining;
    item.scannedQty += bulkQty;
    errCount += overBy;
    okCount += remaining;
    showBanner('err', '입고수량 초과', `${item.name} / ${item.spec} — 발주 ${item.orderQty}개인데 ${item.scannedQty}개 입고 (초과 ${overBy}개)`, '⚠️');
    addLog(timeStr, displayCode, false, `박스 수량 ${bulkQty} 스캔 → 초과 ${overBy}개`);
    playErrSound();
  }

  renderTables();
  updateMiniStats();
  checkAllComplete();
}

scanInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    const raw = scanInput.value.trim();
    scanInput.value = '';
    if(!raw) return;
    processScan(raw);
  }
});
function focusInput(){ scanInput.focus(); }
document.addEventListener('click', (e)=>{
  if(!e.target.closest('input, button, .overlay')) focusInput();
});

/* ===================== 완료 처리 ===================== */
function checkAllComplete(){
  if(items.length === 0) return;
  const allDone = items.every(it => it.scannedQty >= it.orderQty);
  if(!allDone) return;

  setTimeout(()=>{
    const supplier = (document.getElementById('supplierInput').value || '').trim() || '공급처 미입력';
    const now = new Date();
    const displayTime = now.toLocaleString('ko-KR');
    const itemCount = items.length;
    const totalQty = items.reduce((s,it)=>s+it.orderQty,0);

    document.getElementById('completeSummary').textContent = `총 ${itemCount}품목, ${totalQty}개 수량 입고 확인이 완료되었습니다.`;
    document.getElementById('completeSupplier').textContent = supplier;
    document.getElementById('completeTime').textContent = displayTime;
    document.getElementById('overlay').classList.add('show');
    playCompleteSound();
    speakKorean('입고 검수 완료');

    if(gasWebhookUrl){
      const startTime = inspectionStartTime ? inspectionStartTime.toLocaleTimeString('ko-KR',{hour12:false}) : '';
      const completeTimeOnly = now.toLocaleTimeString('ko-KR',{hour12:false});
      fetch(gasWebhookUrl, {
        method:'POST',
        body: JSON.stringify({
          type: 'inbound',
          supplier, documentKey: currentDocumentKey,
          startTime, time: completeTimeOnly,
          itemCount, totalQty, errCount,
        })
      }).then(()=> console.log('입고기록 저장 완료')).catch(err=> console.warn('입고기록 저장 실패:', err));
    }

    setTimeout(()=>{
      document.getElementById('overlay').classList.remove('show');
      focusInput();
    }, 3000);
  }, 150);
}

document.getElementById('closeOverlay').addEventListener('click', ()=>{
  document.getElementById('overlay').classList.remove('show');
});

/* ===================== 발주서 엑셀 업로드 (ESG005E 형식) ===================== */
document.getElementById('fileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});

      let supplier = '', docKey = '';
      for(let r=0; r<Math.min(rows.length, 10); r++){
        const cell = String(rows[r][0] || '');
        if(cell.includes('전표번호')){
          const m = cell.match(/전표번호\s*[:：]\s*(.+)/);
          if(m) docKey = m[1].trim();
        }
        if(cell.includes('수신-거래처') || cell.includes('수신거래처')){
          const m = cell.match(/수신-?거래처\s*[:：]\s*(.+)/);
          if(m) supplier = m[1].trim();
        }
      }

      let headerRowIdx = -1, colCode = -1, colName = -1, colQty = -1;
      for(let r=0; r<Math.min(rows.length, 15); r++){
        const row = rows[r].map(v=>String(v).trim());
        const ci = row.indexOf('품목코드');
        if(ci !== -1){
          headerRowIdx = r;
          colCode = ci;
          colName = row.findIndex(c => c.startsWith('품목명'));
          colQty = row.findIndex(c => c.startsWith('수량'));
          break;
        }
      }
      if(headerRowIdx === -1){
        alert('업로드한 파일에서 "품목코드" 헤더를 찾지 못했습니다. 발주서 양식(ESG005E 등)과 같은 파일인지 확인해주세요.');
        return;
      }

      const agg = {}; const order = [];
      for(let r=headerRowIdx+1; r<rows.length; r++){
        const row = rows[r];
        const code = row[colCode];
        if(!code || String(code).trim()==='') continue;
        const qty = parseQtyValue(colQty!==-1 ? row[colQty] : '');
        if(!qty || isNaN(qty) || qty<=0) continue;
        const c = String(code).trim();
        const nameRaw = colName!==-1 ? String(row[colName]||'') : '';
        const { name, spec } = splitNameSpec(nameRaw);
        if(agg[c]){ agg[c].qty += qty; }
        else { agg[c] = {code:c, name, spec, qty}; order.push(c); }
      }
      const list = order.map(c=>agg[c]);
      if(list.length === 0){
        alert('유효한 품목 데이터를 찾지 못했습니다.');
        return;
      }

      loadItems(list);
      currentDocumentKey = docKey;
      if(supplier) document.getElementById('supplierInput').value = supplier;
      document.getElementById('documentKeyInput').value = docKey;
      document.getElementById('orderInfo').innerHTML =
        `<b>발주서로 불러온 입고</b> · <b>전표번호:</b> ${escapeHtml(docKey || '-')} · <b>공급처:</b> ${escapeHtml(supplier || '-')} · <b>품목수:</b> ${list.length}개`;

      focusInput();
    }catch(err){
      alert('파일을 읽는 중 오류가 발생했습니다: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
});

/* ===================== 구글시트 연동 ===================== */
document.getElementById('gasConnectBtn').addEventListener('click', async ()=>{
  const url = (document.getElementById('gasUrlInput').value || '').trim();
  if(!url){ alert('Apps Script 웹앱 URL을 입력해주세요.'); return; }
  gasWebhookUrl = url;
  try{ await idbSet('gasWebhookUrl_inbound', url); }catch(err){ console.warn(err); }
  document.getElementById('gasStatus').textContent = '✅ 연결됨 · 입고완료 시 구글시트에 자동 기록됩니다';
  document.getElementById('gasStatus').classList.add('ok');
});
(async function restoreGasUrl(){
  try{
    const url = await idbGet('gasWebhookUrl_inbound');
    if(url){
      gasWebhookUrl = url;
      document.getElementById('gasUrlInput').value = url;
      document.getElementById('gasStatus').textContent = '✅ 연결됨 · 입고완료 시 구글시트에 자동 기록됩니다';
      document.getElementById('gasStatus').classList.add('ok');
    }
  }catch(err){ /* 저장된 값 없음 */ }
})();

/* ===================== 검수 초기화 / 소리 토글 ===================== */
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm('현재 입고 검수 진행 상황을 초기화할까요? (품목 목록은 유지되고 스캔 기록만 지워집니다)')) return;
  items.forEach(it => it.scannedQty = 0);
  okCount = 0; errCount = 0; logList.innerHTML = '';
  inspectionStartTime = new Date();
  renderTables();
  updateMiniStats();
  showBanner('idle', '스캔 대기중', '', '📦');
});
document.getElementById('soundToggle').addEventListener('click', function(){
  soundOn = !soundOn;
  this.textContent = soundOn ? '🔊 소리 켜짐' : '🔇 소리 꺼짐';
  if(soundOn) ensureAudio();
});

focusInput();
</script>
