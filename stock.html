<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>재고조회</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#161D65; --bg:#F5F6FB; --panel:#ffffff; --line:#DDE1EE; --text:#15171c; --sub:#5b6175;
    --ok:#15803D; --err:#B91C1C; --in:#1D4ED8; --inbg:#E8F0FF; --warnbg:#FFF4E5; --warn:#9A3412;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:16px}
  header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:10}
  header h1{margin:0;font-size:19px;font-weight:900}
  header .meta{font-size:12px;opacity:.85;text-align:right;line-height:1.35}
  nav{display:flex;background:#fff;border-bottom:1px solid var(--line)}
  nav button{flex:1;border:0;background:none;padding:12px 0;font-size:15px;font-weight:800;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;font-family:inherit}
  nav button.on{color:var(--navy);border-bottom-color:var(--navy)}
  main{max-width:640px;margin:0 auto;padding:14px 16px 40px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .row{display:flex;gap:8px;align-items:center}
  input[type=text],textarea,input[type=date]{width:100%;border:2px solid var(--line);border-radius:10px;padding:12px;font-size:17px;font-family:inherit;background:#fff;color:var(--text)}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--navy)}
  textarea{font-size:13px;min-height:140px;font-family:Consolas,monospace}
  .btn{border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn.primary{background:var(--navy);color:#fff}
  .btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
  .btn.danger{background:#fff;color:var(--err);border:1.5px solid var(--err);padding:6px 10px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:default}
  #reader{width:100%;border-radius:12px;overflow:hidden;background:#000;display:none;margin-bottom:10px}
  .hint{font-size:13px;color:var(--sub);line-height:1.5}
  .status{font-size:14px;padding:10px 12px;border-radius:10px;margin-top:10px;line-height:1.5;white-space:pre-line}
  .status.ok{background:#E9F7EF;color:var(--ok)} .status.err{background:#FDECEC;color:var(--err)} .status.info{background:var(--inbg);color:var(--in)}
  .result .code{font-size:22px;font-weight:900;letter-spacing:.5px}
  .result .name{font-size:15px;color:var(--sub);margin-top:2px}
  .big{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 10px;padding:12px 14px;background:var(--navy);color:#fff;border-radius:12px}
  .big .lab{font-size:15px;font-weight:700}
  .big .num{font-size:40px;font-weight:900}
  .line{display:flex;justify-content:space-between;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--line);font-size:17px}
  .line .v{font-weight:900;font-size:20px}
  .line .sm{font-size:12px;color:var(--sub);display:block;margin-top:2px}
  .line.inb{background:var(--inbg);border-radius:10px;padding:10px 12px;border:0;margin:6px 0;color:var(--in)}
  .line.inb .v{color:var(--in)}
  .line.out .v{color:var(--err)}
  .note{font-size:13px;color:var(--warn);background:var(--warnbg);border-radius:8px;padding:8px 10px;margin-top:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--text)}
  .chip.cur{border-color:var(--navy);background:var(--navy);color:#fff}
  .list button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 4px;font-size:15px;cursor:pointer;font-family:inherit;color:var(--text)}
  .list .q{font-weight:900}
  h2{font-size:17px;margin:0 0 6px;color:var(--navy)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
  .tag{display:inline-block;white-space:nowrap;font-size:12px;font-weight:800;border-radius:6px;padding:2px 6px;color:#fff}
  .tag.입고{background:var(--in)} .tag.반품{background:var(--ok)}
  .hidden{display:none}
  .line.plusl .v{color:var(--in)}
  .livebtn{margin-top:12px;width:100%;display:block;text-align:left;background:#E6F6F3;border:1.5px solid #0F766E;border-radius:12px;padding:12px 14px;color:#0F766E;font-family:inherit;cursor:pointer}
  .livebtn .lt{display:flex;justify-content:space-between;font-size:16px;font-weight:800}
  .livebtn .ls{display:block;font-size:14px;font-weight:700;color:#134e48;margin-top:4px}
  #sheetWrap{position:fixed;inset:0;z-index:50}
  .sheetDim{position:absolute;inset:0;background:rgba(10,14,40,.45)}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px 22px;box-shadow:0 -6px 20px rgba(0,0,0,.2);max-height:85vh;overflow:auto}
  .sheet .grab{width:44px;height:5px;border-radius:3px;background:#cfd3de;margin:0 auto 10px}
  .sheet h3{margin:0;font-size:18px;color:#0F766E}.sheet .sub{font-size:12.5px;color:var(--sub);margin:2px 0 10px}
  .st{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid #EEF0F4}
  .st:last-child{border-bottom:0}
  .st .dot{width:12px;height:12px;border-radius:6px}.st .t{font-size:17px;font-weight:900}.st .t small{display:block;font-size:12.5px;color:var(--sub);font-weight:500;margin-top:2px;line-height:1.45}
  .st .q{font-size:26px;font-weight:900}
  details summary{cursor:pointer;font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<header>
  <h1>재고조회</h1>
  <div class="meta" id="metaText">불러오는 중...</div>
</header>
<nav>
  <button type="button" id="tabFind" class="on">조회</button>
  <button type="button" id="tabReg">입고 등록</button>
</nav>

<div id="sheetWrap" class="hidden">
  <div class="sheetDim" id="sheetDim"></div>
  <div class="sheet"><div class="grab"></div><div id="sheetBody"></div><button type="button" class="btn ghost" id="sheetClose" style="width:100%;margin-top:12px">닫기</button></div>
</div>
<main>
<!-- ===================== 조회 ===================== -->
<section id="viewFind">
  <div class="panel">
    <div id="reader"></div>
    <div id="zoomRow" class="row hidden" style="margin:-4px 0 10px;gap:6px"><span class="hint">확대</span></div>
    <div id="photoDecoder" style="display:none"></div>
    <div class="row">
      <input type="text" id="codeInput" placeholder="품목코드 또는 품번 일부 (예: 3507)" autocomplete="off" autocapitalize="characters">
      <button type="button" class="btn primary" id="searchBtn">찾기</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button type="button" class="btn ghost" id="camBtn" style="flex:1;min-width:0;padding:12px 6px">카메라로 찍기</button>
      <label class="btn ghost" for="photoInput" style="flex:1;min-width:0;padding:12px 6px;text-align:center">사진으로 읽기</label>
      <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
      <button type="button" class="btn ghost" id="refreshBtn" aria-label="새로고침" style="padding:12px 12px">⟳</button>
    </div>
    <div id="findStatus"></div>
  </div>
  <div id="resultArea"></div>
</section>

<!-- ===================== 등록 ===================== -->
<section id="viewReg" class="hidden">
  <div class="panel">
    <h2>오늘 입고 붙여넣기 (하루 여러 번 가능)</h2>
    <div class="hint">이카운트 입고 화면(일자-No · 품목코드 · 패킹넘버 · 수량 · 적요)을 머리글 줄부터 긁어서 붙여넣으세요. <b>적요(공장) + 패킹넘버(CTN)</b>별로 저장돼서 조회할 때 "YL 268 CTN"처럼 보여요. 이미 넣은 CTN 줄은 다시 붙여넣어도 자동으로 빠져요.</div>
    <textarea id="inText" placeholder="일자-No.	품목별납기일자	품목코드	품목명	규격	패킹넘버	수량	...	거래처	적요&#10;2026/10/10 -2	2026/10/21	NTA8004B111	NT-8004-B1BA	차콜-기본-S	1	1	...	CNK	FY"></textarea>
    <div id="inStatus"></div>
    <button type="button" class="btn primary" id="inUploadBtn" style="margin-top:8px;width:100%">입고 등록</button>
  </div>

  <div class="panel">
    <h2>오늘 등록된 입고</h2>
    <div id="batchList" class="hint">불러오는 중...</div>
  </div>

  <div class="panel">
    <details>
      <summary>연동 주소 (서버 바뀌었을 때만)</summary>
      <input type="text" id="urlInput" style="margin-top:8px;font-size:12px">
      <button type="button" class="btn ghost" id="urlSaveBtn" style="margin-top:8px">저장</button>
    </details>
  </div>
</section>
</main>

<script>
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbzn0Um-dDJXIxorjlU7AnMd4BXV0tzHmwz19GRdobP4V5xDOwDhNt0K9qKcvW9BGE8i/exec';
let gasUrl = DEFAULT_URL;
try { gasUrl = localStorage.getItem('stockGasUrl') || DEFAULT_URL; } catch (e) {}

// 주소 뒤에 ?code=품목코드 를 붙여서 열면 바로 그 품목을 보여준다 (기본 카메라앱으로 QR 찍어서 여는 용도)
let initialCode = '';
try { initialCode = new URLSearchParams(location.search).get('code') || ''; } catch (e) {}
let stock = null;          // 서버 계산 결과 {baseDate, today, items:{code:{...}}}
let lastCode = '';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ko-KR');

function businessToday(){
  const now = new Date(); const d = new Date(now);
  if(now.getHours() < 5) d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function md(ymd){ const p = String(ymd || '').split('-'); return p.length === 3 ? `${Number(p[1])}/${Number(p[2])}` : ymd; }
function setStatus(el, kind, text){ $(el).innerHTML = text ? `<div class="status ${kind}">${esc(text)}</div>` : ''; }

/* ---------- 탭 ---------- */
function showTab(which){
  $('tabFind').classList.toggle('on', which === 'find');
  $('tabReg').classList.toggle('on', which === 'reg');
  $('viewFind').classList.toggle('hidden', which !== 'find');
  $('viewReg').classList.toggle('hidden', which !== 'reg');
  if(which === 'reg'){ stopCamera(); loadBatches(); }
}
$('tabFind').addEventListener('click', () => showTab('find'));
$('tabReg').addEventListener('click', () => showTab('reg'));

/* ---------- 서버 ---------- */
async function getJson(params){
  const res = await fetch(gasUrl + '?' + params);
  return res.json();
}
async function postJson(body){
  const res = await fetch(gasUrl, { method:'POST', body: JSON.stringify(body) });
  return res.json();
}

async function loadStock(force){
  $('metaText').textContent = '불러오는 중...';
  try{
    const data = await getJson('action=getStockStatus' + (force ? '&force=1' : ''));
    if(!data.ok) throw new Error(data.error || '알 수 없는 오류');
    stock = data;
    $('metaText').innerHTML = `이카운트 ${esc(data.liveUpdatedAt || '?')} 갱신<br>조회 ${esc(String(data.updatedAt || '').slice(0, 5))}`;
    if(lastCode) showItem(lastCode, true);
    else if(initialCode){ const c0 = initialCode; initialCode = ''; lookup(c0); }
  }catch(err){
    $('metaText').textContent = '불러오기 실패';
    setStatus('findStatus', 'err', '재고 정보를 불러오지 못했어요: ' + err.message);
  }
}
loadStock(false);
setInterval(() => { if(!document.hidden) loadStock(false); }, 120000); // 2분마다 (검수완료 반영)
$('refreshBtn').addEventListener('click', () => loadStock(true));

/* ---------- 조회 ---------- */
function normalizeCode(raw){
  let c = String(raw || '').trim().toUpperCase().replace(/(\d)[\s\-_()]*(HP|FA)\)?\s*$/i, '$1');
  // QR 안에 다른 글자가 섞여 있으면 품목코드 모양(영문3+영숫자4+영숫자2+숫자2)만 뽑는다
  if(stock && !stock.items[c]){
    const m = c.match(/[A-Z]{3}[A-Z0-9]{4}[A-Z0-9]{2}\d{2}/);
    if(m && stock.items[m[0]]) c = m[0];
  }
  return c;
}

function lookup(raw){
  setStatus('findStatus', '', '');
  if(!stock){ setStatus('findStatus', 'err', '재고 정보를 아직 못 불러왔어요. 새로고침을 눌러주세요.'); return; }
  const q = normalizeCode(raw);
  if(!q) return;
  if(stock.items[q]){ showItem(q); return; }
  // 일부만 입력한 경우: 품목코드나 품목명(TT-3507-C2BA)에 포함된 것들
  const qq = q.replace(/[\s\-]/g, '');
  const hits = Object.keys(stock.items).filter(c => c.includes(qq) || String(stock.items[c].n || '').replace(/-/g, '').toUpperCase().includes(qq)).sort();
  if(!hits.length){ $('resultArea').innerHTML = ''; setStatus('findStatus', 'err', `"${q}" 품목을 찾지 못했어요.`); return; }
  if(hits.length === 1){ showItem(hits[0]); return; }
  const shown = hits.slice(0, 40);
  $('resultArea').innerHTML = `<div class="panel list"><div class="hint" style="margin-bottom:4px">${hits.length}개 품목${hits.length > 40 ? ' (앞 40개만)' : ''}</div>` +
    shown.map(c => { const it = stock.items[c]; return `<button type="button" data-code="${esc(c)}"><span>${esc(c)} <span class="hint">${esc(it.s || '')}</span></span><span class="q">${fmt(it.e || 0)}</span></button>`; }).join('') + '</div>';
  $('resultArea').querySelectorAll('button[data-code]').forEach(b => b.addEventListener('click', () => showItem(b.dataset.code)));
}

// 입고 박스 목록 → 공장별 한 줄: "YL  266~268번 각 40 · 270번 12"
function boxSummaryHtml(inb){
  const byF = {}, other = [];
  inb.forEach(x => {
    const m = String(x[1]).match(/^([^\d]+?)\s*(\d+)$/);
    if(m){ (byF[m[1]] = byF[m[1]] || []).push({ n: Number(m[2]), q: Number(x[2]) || 0 }); }
    else other.push(`${x[0]} ${x[1]} ${fmt(x[2])}개`);
  });
  const lines = Object.keys(byF).sort().map(f => {
    const arr = byF[f].sort((a, b) => a.n - b.n);
    const parts = []; let k = 0;
    while(k < arr.length){
      let j = k;
      while(j + 1 < arr.length && arr[j + 1].n === arr[j].n + 1 && arr[j + 1].q === arr[k].q) j++;
      parts.push(j > k ? `${arr[k].n}~${arr[j].n} CTN 각 ${fmt(arr[k].q)}` : `${arr[k].n} CTN ${fmt(arr[k].q)}`);
      k = j + 1;
    }
    const tot = arr.reduce((s, a) => s + a.q, 0);
    return `<div style="margin-top:6px;font-size:15px"><span class="tag 입고" style="font-size:14px">${esc(f)}</span> <b>${esc(parts.join(' · '))}</b> <span class="hint" style="color:var(--in)">(${arr.length}CTN ${fmt(tot)}개)</span></div>`;
  });
  if(other.length) lines.push(`<div class="sm" style="color:var(--in);margin-top:4px">${esc(other.join(' · '))}</div>`);
  return lines.join('');
}

function sumQty(list){ return (list || []).reduce((a, x) => a + (Number(x[1]) || 0), 0); }
function showItem(code, quiet){
  const it = stock.items[code] || {};
  lastCode = code;
  const live = it.live || 0, p = it.p || 0, k = it.k || 0;
  const expected = it.e != null ? it.e : live + p - k;
  const st = it.st || { pre:[], ing:[], picked:[], insp:[], done:0, doneSlips:0 };
  const nPre = sumQty(st.pre), nIng = sumQty(st.ing), nPicked = sumQty(st.picked) + sumQty(st.insp), nDone = st.done || 0;
  let html = `<div class="panel result">
    <div class="code">${esc(code)}</div>
    <div class="name">${esc(it.n || '')}${it.s ? ' / ' + esc(it.s) : ''}</div>
    <div class="big"><span class="lab">지금 있어야 할 수량<span style="display:block;font-size:12px;color:#c9cdf0;font-weight:500">선반 기준</span></span><span class="num">${fmt(expected)}</span></div>
    <div class="line"><span>이카운트 재고<span class="sm">${esc(stock.liveUpdatedAt || '')} 기준</span></span><span class="v">${fmt(live)}</span></div>
    <div class="line plusl"><span>+ 판매현황 등록<span class="sm">아직 검수 안 끝난 전표</span></span><span class="v">+${fmt(p)}</span></div>
    <div class="line out"><span>− 피킹완료<span class="sm">이미 선반에서 가져간 수량</span></span><span class="v">${k ? '−' + fmt(k) : '0'}</span></div>
    <button type="button" class="livebtn" id="liveBtn"><span class="lt"><span>실재고 움직임 보기</span><span>▸</span></span>
      <span class="ls">피킹 전 ${fmt(nPre)}${nIng ? ' · 피킹 중 ' + fmt(nIng) : ''} · 피킹완료 ${fmt(nPicked)} · 검수완료 ${fmt(nDone)}</span></button>`;
  if(it.i){
    html += `<div class="line inb" style="display:block"><div style="display:flex;justify-content:space-between;align-items:baseline"><span>오늘 입고</span><span class="v">+${fmt(it.i)}</span></div>${boxSummaryHtml(it.inb || [])}</div>`;
  }
  if(!stock.items[code]) html += `<div class="note">이카운트 재고에 없는 품목코드예요 (재고 0이거나 코드가 다를 수 있어요).</div>`;
  const stem = code.slice(0, -1);
  const sibs = Object.keys(stock.items).filter(x => x.length === code.length && x.slice(0, -1) === stem).sort();
  if(sibs.length > 1){
    html += `<div class="chips">` + sibs.map(x => {
      const s2 = stock.items[x]; const size = String(s2.s || '').split('-').pop() || x.slice(-1);
      return `<button type="button" class="chip${x === code ? ' cur' : ''}" data-code="${esc(x)}">${esc(size)} ${fmt(s2.e || 0)}</button>`;
    }).join('') + `</div>`;
  }
  html += `</div>`;
  $('resultArea').innerHTML = html;
  $('resultArea').querySelectorAll('.chip[data-code]').forEach(btn => btn.addEventListener('click', () => showItem(btn.dataset.code)));
  $('liveBtn').addEventListener('click', () => openLiveSheet(code));
  if(!quiet) $('codeInput').value = code;
}

// 실재고 움직임 배너 (아래에서 올라오는 창)
function openLiveSheet(code){
  const it = stock.items[code] || {};
  const st = it.st || { pre:[], ing:[], picked:[], insp:[], done:0, doneSlips:0 };
  const who = list => list.map(x => esc(x[0]) + ' ' + fmt(x[1])).join(' · ');
  const rows = [
    ['#9AA3B8', '피킹 전', '선반에 있음' + (st.pre.length ? ' · ' + who(st.pre) : ''), sumQty(st.pre)],
  ];
  if(st.ing.length) rows.push(['#D97706', '피킹 중', '가져오는 중 · ' + st.ing.map(x => `${esc(x[0])} ${fmt(x[1])} (${esc(x[2])})`).join(' · '), sumQty(st.ing)]);
  const pickedDesc = [].concat(
    st.picked.map(x => `${esc(x[0])} ${fmt(x[1])} (${esc(x[2])}${x[3] ? ' ' + esc(x[3]) : ''})`),
    st.insp.map(x => `${esc(x[0])} ${fmt(x[1])} (검수 중 · ${esc(x[2])})`)
  ).join(' · ');
  rows.push(['#2563EB', '피킹완료', '검수대에 있음' + (pickedDesc ? ' · ' + pickedDesc : ''), sumQty(st.picked) + sumQty(st.insp)]);
  rows.push(['#15803D', '검수완료', `오늘 출고${st.doneSlips ? ' · 전표 ' + st.doneSlips + '건' : ''}`, st.done || 0]);
  $('sheetBody').innerHTML = `<h3>실재고 움직임 · ${esc(code)}</h3><div class="sub">판매현황 전표 기준 · 이카운트 ${esc(stock.liveUpdatedAt || '')}</div>` +
    rows.map(r => `<div class="st"><span class="dot" style="background:${r[0]}"></span><span class="t">${r[1]}<small>${r[2]}</small></span><span class="q">${fmt(r[3])}</span></div>`).join('');
  $('sheetWrap').classList.remove('hidden');
}
function closeLiveSheet(){ $('sheetWrap').classList.add('hidden'); }

$('searchBtn').addEventListener('click', () => lookup($('codeInput').value));
$('codeInput').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); lookup($('codeInput').value); } });

/* ---------- 카메라 ---------- */
let scanner = null, scanning = false, lastScan = { t:'', at:0 };
const SCAN_FORMATS = () => { const F = Html5QrcodeSupportedFormats; return [F.QR_CODE, F.CODE_128, F.CODE_39, F.EAN_13, F.DATA_MATRIX]; };
async function startCamera(){
  if(typeof Html5Qrcode === 'undefined'){ setStatus('findStatus', 'err', '카메라 기능을 불러오지 못했어요 (인터넷 연결 확인).'); return; }
  $('reader').style.display = 'block';
  scanner = scanner || new Html5Qrcode('reader', { formatsToSupport: SCAN_FORMATS(), experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
  try{
    // 작은 QR도 읽히게: 고해상도 + 연속 초점 요청, 인식 칸은 화면 가운데 정사각형
    await scanner.start({ facingMode: 'environment' }, {
      fps: 15,
      qrbox: (w, h) => { const side = Math.floor(Math.min(w, h) * 0.7); return { width: side, height: side }; },
      videoConstraints: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: 'continuous' }] },
    }, onScan, () => {});
    scanning = true;
    $('camBtn').textContent = '카메라 끄기';
    setupZoom();
  }catch(err){
    $('reader').style.display = 'none';
    setStatus('findStatus', 'err', '카메라를 켜지 못했어요. 브라우저에서 카메라 권한을 허용했는지, 주소가 https인지 확인해주세요.\n' + err);
  }
}
// 휴대폰이 줌을 지원하면(대부분 안드로이드) 확대 버튼을 보여준다.
// 작은 QR은 가까이 대면 초점이 안 맞아서 안 읽히므로, 한 뼘 정도 떨어져서 2배 확대가 가장 잘 읽힌다.
function setupZoom(){
  const row = $('zoomRow');
  row.querySelectorAll('button').forEach(b => b.remove());
  row.classList.add('hidden');
  let caps = null;
  try{ caps = scanner.getRunningTrackCapabilities(); }catch(e){}
  if(!caps || !caps.zoom || !(caps.zoom.max > 1)) return;
  const max = caps.zoom.max;
  const levels = [1, 1.5, 2, 3, 4].filter(z => z <= max);
  const apply = z => {
    scanner.applyVideoConstraints({ advanced: [{ zoom: z }] }).catch(() => {});
    row.querySelectorAll('button').forEach(b => b.classList.toggle('primary', Number(b.dataset.z) === z));
    row.querySelectorAll('button').forEach(b => b.classList.toggle('ghost', Number(b.dataset.z) !== z));
  };
  levels.forEach(z => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn ghost'; b.style.padding = '6px 12px'; b.style.fontSize = '14px';
    b.dataset.z = z; b.textContent = z + '배';
    b.addEventListener('click', () => apply(z));
    row.appendChild(b);
  });
  row.classList.remove('hidden');
  apply(levels.includes(2) ? 2 : levels[levels.length - 1]); // 기본 2배
}
async function stopCamera(){
  if(scanner && scanning){ try{ await scanner.stop(); }catch(e){} }
  scanning = false;
  $('reader').style.display = 'none';
  $('zoomRow').classList.add('hidden');
  $('camBtn').textContent = '카메라로 찍기';
}
// 사진으로 읽기: 휴대폰 기본 카메라로 찍은 사진(고해상도·초점 맞춤)에서 QR/바코드를 찾는다 → 작은 QR에 가장 확실
let photoDecoder = null;
$('photoInput').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  if(typeof Html5Qrcode === 'undefined'){ setStatus('findStatus', 'err', '읽기 기능을 불러오지 못했어요 (인터넷 연결 확인).'); return; }
  if(scanning) await stopCamera();
  setStatus('findStatus', 'info', '사진에서 QR을 찾는 중...');
  photoDecoder = photoDecoder || new Html5Qrcode('photoDecoder', { formatsToSupport: SCAN_FORMATS(), experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
  try{
    const text = await photoDecoder.scanFile(file, false);
    setStatus('findStatus', '', '');
    if(navigator.vibrate) navigator.vibrate(60);
    lookup(text);
  }catch(err){
    setStatus('findStatus', 'err', '사진에서 QR을 찾지 못했어요. QR이 화면 가운데 오도록, 흔들리지 않게 다시 찍어주세요.');
  }
});
function onScan(text){
  const now = Date.now();
  if(text === lastScan.t && now - lastScan.at < 2500) return; // 같은 걸 계속 비추고 있을 때 반복 조회 방지
  lastScan = { t: text, at: now };
  if(navigator.vibrate) navigator.vibrate(60);
  lookup(text);
}
$('camBtn').addEventListener('click', () => scanning ? stopCamera() : startCamera());

/* ---------- 등록: 엑셀 공통 ---------- */
function readWorkbook(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = e => { try{ resolve(XLSX.read(new Uint8Array(e.target.result), { type: 'array' })); }catch(err){ reject(err); } };
    fr.onerror = reject;
    fr.readAsArrayBuffer(file);
  });
}
function sheetRows(ws){ return XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true }); }
function hashText(s){ let h = 5381; for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); }

/* ---------- 입고 붙여넣기 ---------- */
function textToRows(text){ return String(text || '').replace(/\r/g, '').split('\n').map(l => l.split('\t')); }
// 이카운트 화면: 일자-No. | 품목별납기일자 | 품목코드 | 품목명 | 규격 | 패킹넘버 | 수량 | 단품수량 | 장 수 | 단가 | 공급가액 | 거래처 | 적요
// 적요 = 공장(FY, YL, YH ...), 패킹넘버 = 박스번호 → 박스 라벨 "YL268"
let pendingIn = null;
function parseInboundText(text){
  const rows = textToRows(text);
  const hi = rows.findIndex(r => r.some(v => v.trim() === '품목코드') && r.some(v => v.trim() === '패킹넘버'));
  if(hi < 0) throw new Error('"품목코드 … 패킹넘버 … 수량" 머리글 줄을 찾지 못했어요. 머리글 줄부터 같이 긁어주세요.');
  const head = rows[hi].map(v => v.trim());
  const col = name => head.findIndex(h => h.replace(/[\s.]/g, '') === name);
  const iSlip = col('일자-No'), iCode = col('품목코드'), iName = col('품목명'), iSpec = col('규격'), iBox = col('패킹넘버'), iQty = col('수량'), iVendor = col('거래처'), iMemo = col('적요');
  if(iCode < 0 || iQty < 0 || iBox < 0) throw new Error('품목코드/패킹넘버/수량 열을 찾지 못했어요.');
  const lines = {}; let listedTotal = null; const skippedLines = [];
  for(let k = hi + 1; k < rows.length; k++){
    const r = rows[k]; const first = (r[0] || '').trim();
    if(first === '합계'){ listedTotal = Number(String(r[1] || '').replace(/,/g, '')) || null; continue; }
    const code = (r[iCode] || '').trim().toUpperCase();
    if(!/^[A-Z][A-Z0-9]{5,}$/.test(code)) continue;
    const qty = Number(String(r[iQty] || '').replace(/,/g, '')) || 0;
    if(!qty){ skippedLines.push(code); continue; }
    const slip = iSlip >= 0 ? (r[iSlip] || '').trim() : '';
    const factory = ((iMemo >= 0 ? r[iMemo] : '') || '').trim() || ((iVendor >= 0 ? r[iVendor] : '') || '').trim() || '입고';
    const boxNo = (r[iBox] || '').trim();
    const box = factory + boxNo;
    const lineKey = [slip, factory, boxNo, code].join('|');
    if(!lines[lineKey]) lines[lineKey] = { code, qty: 0, name: (r[iName] || '').trim(), spec: (r[iSpec] || '').trim(), box, lineKey, slip, factory };
    lines[lineKey].qty += qty;
  }
  const items = Object.values(lines);
  if(!items.length) throw new Error('입고 품목 줄을 찾지 못했어요.');
  // 전표 + 공장별로 묶어서 저장 (등록 내역에서 묶음 단위로 삭제 가능)
  const groups = {};
  items.forEach(it => { const key = `입고 ${it.slip.replace(/\s+/g, ' ')} ${it.factory}`.trim(); (groups[key] = groups[key] || []).push(it); });
  return { groups, items, listedTotal, skippedLines };
}
$('inText').addEventListener('input', () => {
  pendingIn = null; setStatus('inStatus', '', '');
  if(!$('inText').value.trim()) return;
  try{
    const p = parseInboundText($('inText').value);
    pendingIn = p;
    const total = p.items.reduce((s, it) => s + it.qty, 0);
    const boxes = new Set(p.items.map(it => it.box)).size;
    const byFactory = {};
    p.items.forEach(it => { byFactory[it.factory] = byFactory[it.factory] || { q: 0, b: new Set() }; byFactory[it.factory].q += it.qty; byFactory[it.factory].b.add(it.box); });
    let msg = `${fmt(p.items.length)}줄 · ${fmt(boxes)} CTN · 총 ${fmt(total)}개` + (p.listedTotal != null ? ` (화면 합계 ${fmt(p.listedTotal)})` : '');
    msg += '\n' + Object.keys(byFactory).map(f => `${f}: ${byFactory[f].b.size} CTN · ${fmt(byFactory[f].q)}개`).join(' / ');
    if(p.listedTotal != null && p.listedTotal !== total) msg += `\n⚠ 화면 합계와 달라요. 중간 줄이 빠지지 않았는지 확인해주세요.`;
    if(stock){ const nf = [...new Set(p.items.filter(it => !stock.items[it.code]).map(it => it.code))]; if(nf.length) msg += `\n참고: 재고현황에 없는 새 품목코드 ${nf.length}개: ${nf.slice(0, 5).join(', ')}${nf.length > 5 ? ' ...' : ''}`; }
    setStatus('inStatus', p.listedTotal != null && p.listedTotal !== total ? 'err' : 'info', msg);
  }catch(err){ setStatus('inStatus', 'err', String(err.message || err)); }
});
$('inUploadBtn').addEventListener('click', async () => {
  if(!pendingIn){ setStatus('inStatus', 'err', '입고 화면을 먼저 붙여넣어 주세요.'); return; }
  const btn = $('inUploadBtn'); btn.disabled = true; btn.textContent = '등록 중...';
  let added = 0, addedQty = 0, skipped = 0; const fails = [];
  try{
    for(const key of Object.keys(pendingIn.groups)){
      const items = pendingIn.groups[key];
      const res = await postJson({ type: 'addStockMovement', kind: '입고', docKey: key, date: businessToday(), source: key.replace(/^입고\s*/, ''), items: items.map(it => ({ code: it.code, qty: it.qty, name: it.name, spec: it.spec, box: it.box, lineKey: it.lineKey })) });
      if(!res.ok){ fails.push(`${key}: ${res.error}`); continue; }
      if(res.duplicate){ skipped += items.length; continue; }
      added += res.lines; addedQty += res.total; skipped += res.skipped || 0;
    }
    let msg = `등록 완료: 새로 ${fmt(added)}줄 · +${fmt(addedQty)}개`;
    if(skipped) msg += `\n이미 들어가 있던 ${fmt(skipped)}줄은 빼고 넣었어요.`;
    if(fails.length) msg += `\n실패: ${fails.join(' / ')}`;
    setStatus('inStatus', fails.length ? 'err' : 'ok', msg);
    if(!fails.length){ $('inText').value = ''; pendingIn = null; }
    loadStock(true); loadBatches();
  }catch(err){ setStatus('inStatus', 'err', '등록 실패: ' + err.message); }
  finally{ btn.disabled = false; btn.textContent = '입고 등록'; }
});

/* ---------- 등록 내역 ---------- */
async function loadBatches(){
  try{
    const data = await getJson('action=getStockMovements');
    if(!data.ok) throw new Error(data.error);
    const head = `${data.today || ''} 등록분`;
    if(!data.batches.length){ $('batchList').innerHTML = `오늘 등록된 입고가 없어요.`; return; }
    $('batchList').innerHTML = `<div style="margin-bottom:6px">${esc(head)}</div><table><tr><th>구분</th><th>내용</th><th>수량</th><th></th></tr>` +
      data.batches.map(b => `<tr><td><span class="tag ${esc(b.kind)}">${esc(b.kind)}</span></td><td>${esc(b.source || b.docKey)}<br><span class="hint">${esc(b.at)} · ${b.boxes ? fmt(b.boxes) + 'CTN · ' : ''}${fmt(b.lines)}줄</span></td><td><b>${b.total > 0 ? '+' : ''}${fmt(b.total)}</b></td><td><button type="button" class="btn danger" data-key="${esc(b.docKey)}">삭제</button></td></tr>`).join('') + '</table>';
    $('batchList').querySelectorAll('button[data-key]').forEach(btn => btn.addEventListener('click', async () => {
      if(!confirm(`이 등록을 삭제할까요?\n${btn.dataset.key}`)) return;
      btn.disabled = true;
      const res = await postJson({ type: 'deleteStockMovement', docKey: btn.dataset.key });
      if(!res.ok) alert('삭제 실패: ' + res.error);
      loadStock(true); loadBatches();
    }));
  }catch(err){ $('batchList').textContent = '불러오기 실패: ' + err.message; }
}
