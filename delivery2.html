<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>배송완료 확인 (스캐너버전)</title>
<!-- ⚠️ 이 버전은 하드웨어 바코드 스캐너로 입력받습니다. 카메라로 QR을 찍는 QrScanner 라이브러리는 안 씁니다. -->
<style>
  :root{
    --bg:#FFFFFF; --panel:#F5F6FB; --line:#DCE0EE; --text:#171B3D; --sub:#6C7293;
    --ok:#16A34A; --err:#DC2626; --accent:#FFB200; --accent-ink:#1A1300; --navy:#161D65;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
  }
  #app{ display:flex; flex-direction:column; height:100vh; }

  .topbar{
    background:var(--navy); color:#fff; padding:14px 18px; font-weight:800; font-size:17px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .topbar .gear{ font-size:20px; cursor:pointer; padding:4px; }

  .screen{ flex:1; display:none; flex-direction:column; min-height:0; }
  .screen.active{ display:flex; }

  /* ---- 스캐너 대기 화면 ---- */
  #scanScreen{ align-items:center; justify-content:center; padding:24px; gap:16px; text-align:center; background:var(--bg); }
  .scan-ready-badge{
    display:flex; align-items:center; gap:8px; justify-content:center;
    font-size:15px; font-weight:800; color:var(--ok);
  }
  .scan-ready-dot{
    width:10px; height:10px; border-radius:50%; background:var(--ok);
    animation:pulse-dot 1.4s ease-in-out infinite;
  }
  @keyframes pulse-dot{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
  .scan-debug-box{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font-size:12px; color:var(--sub); font-family:monospace;
    width:100%; max-width:320px; word-break:break-all; min-height:20px;
  }

  /* ---- 확인 화면 ---- */
  #confirmScreen{ align-items:center; justify-content:center; padding:24px; gap:18px; text-align:center; }
  .confirm-card{
    background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:30px 26px;
    width:100%; max-width:360px;
  }
  .confirm-card .company{ font-size:26px; font-weight:900; color:var(--navy); margin-bottom:8px; word-break:keep-all; }
  .confirm-card .bags{ font-size:17px; font-weight:700; color:var(--sub); }
  .confirm-card .bags b{ color:var(--accent); font-size:22px; }

  /* ---- 촬영 화면 ---- */
  #captureScreen{ position:relative; background:#000; }
  #captureVideo{ width:100%; height:100%; object-fit:cover; }
  .shutter-wrap{ position:absolute; left:0; right:0; bottom:30px; display:flex; justify-content:center; }
  .shutter-btn{
    width:76px; height:76px; border-radius:50%; background:#fff; border:6px solid rgba(255,255,255,0.5);
  }

  /* ---- 미리보기/전송 화면 ---- */
  #previewScreen{ background:#000; position:relative; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #previewImg{ width:100%; height:100%; object-fit:contain; background:#000; }
  .preview-actions{
    position:absolute; left:0; right:0; bottom:24px; display:flex; gap:14px; justify-content:center; padding:0 20px;
  }

  /* ---- 전송완료 화면 ---- */
  #doneScreen{ align-items:center; justify-content:center; padding:24px; gap:14px; text-align:center; }
  .done-check{ font-size:64px; }
  .done-title{ font-size:22px; font-weight:900; color:var(--ok); }
  .done-sub{ font-size:14px; color:var(--sub); }

  button.big{
    flex:1; max-width:220px; padding:16px 0; font-size:16px; font-weight:800; border-radius:14px; border:none;
    cursor:pointer;
  }
  button.big.primary{ background:var(--accent); color:var(--accent-ink); }
  button.big.ghost{ background:#fff; color:var(--text); border:1px solid var(--line); }
  button.big:disabled{ opacity:.5; }

  .settings-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:50;
    align-items:center; justify-content:center; padding:20px;
  }
  .settings-overlay.show{ display:flex; }
  .settings-card{ background:#fff; border-radius:16px; padding:22px; width:100%; max-width:380px; }
  .settings-card h3{ margin:0 0 12px; font-size:16px; }
  .settings-card input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; margin-bottom:14px;
  }
</style>
</head>
<body>
<!-- 카톡 자동발송 실패 알림 배너: 어떤 화면에 있든 위에 겹쳐서 뜬다 -->
<div id="failNoticeOverlay" style="display:none; position:fixed; inset:0; background:rgba(10,14,30,0.55); z-index:999; align-items:center; justify-content:center;">
  <div style="background:#161D65; color:#ECEEFB; border-radius:16px; padding:24px 26px; max-width:340px; width:85%; text-align:left;">
    <div style="font-size:32px; text-align:center;">⚠️</div>
    <div style="font-weight:800; font-size:16px; margin:8px 0 10px; text-align:center;">카톡 자동발송 실패</div>
    <div id="failNoticeList" style="font-size:13px; color:#AEB4E0; max-height:180px; overflow-y:auto; margin-bottom:16px;"></div>
    <button id="failNoticeAckBtn" style="width:100%; background:#FFB200; color:#1A1300; font-weight:800; border:none; border-radius:10px; padding:12px; font-size:14px;">확인했습니다</button>
  </div>
</div>
<div id="app">
  <div class="topbar">
    <span class="gear" id="homeBtn">🏠</span>
    <span>🚚 배송완료 확인</span>
    <span class="gear" id="settingsBtn">⚙️</span>
  </div>

  <!-- 0. 홈 화면 (구간별 체크포인트 + 업체 배송 시작) -->
  <div class="screen active" id="homeScreen" style="padding:20px; gap:12px; align-items:stretch;">
    <div style="font-size:14px; font-weight:800; color:var(--sub); margin:6px 0 2px;">구간 체크포인트</div>
    <button class="big ghost milestone-btn" data-milestone="상차전" style="max-width:none; text-align:left; justify-content:flex-start;">📦 상차전사진 (화물칸 촬영)</button>
    <button class="big ghost milestone-btn" data-milestone="상차후" style="max-width:none; text-align:left; justify-content:flex-start;">📦 상차후사진 (화물칸 촬영)</button>
    <button class="big ghost milestone-btn" data-milestone="출발" style="max-width:none; text-align:left; justify-content:flex-start;">🚗 출발 (계기판 촬영)</button>
    <button class="big ghost milestone-btn" data-milestone="도착" style="max-width:none; text-align:left; justify-content:flex-start;">🅿️ 도착 (계기판 촬영)</button>
    <button class="big ghost" id="dongdaemunEndBtn" style="max-width:none; text-align:left; justify-content:flex-start;">🏁 동대문 배송 종료</button>

    <div style="font-size:14px; font-weight:800; color:var(--sub); margin:16px 0 2px;">업체 배송</div>
    <button class="big primary" id="goToScanBtn" style="max-width:none;">🔦 스캐너로 배송 등록</button>
    <button class="big ghost" id="goToBatchScanBtn" style="max-width:none; text-align:left; justify-content:flex-start;">🏢 여러 업체 한 곳에서 (사진 한 장으로 같이 보내기)</button>
  </div>

  <!-- 1. 스캐너 대기 화면 -->
  <div class="screen" id="scanScreen">
    <div class="scan-ready-badge"><span class="scan-ready-dot"></span><span id="scanReadyLabel">스캔 준비됨</span></div>
    <div id="scanStartLabel" style="font-size:14px; color:var(--sub);">라벨의 바코드를 스캐너로 찍어주세요</div>
    <div class="scan-debug-box" id="scanDebugBox">최근 인식: (아직 없음)</div>
    <button class="big ghost" id="manualEntryBtn" style="max-width:260px;">⌨️ 스캔 안 될 때 (수동입력)</button>

    <div id="batchPanel" style="display:none; position:absolute; left:0; right:0; bottom:0; background:rgba(11,18,32,0.92); padding:14px 16px 18px; border-radius:16px 16px 0 0;">
      <div style="color:#fff; font-weight:800; font-size:14px; margin-bottom:8px;">🏢 스캔된 업체 (<span id="batchCount">0</span>곳)</div>
      <div id="batchListArea" style="max-height:110px; overflow-y:auto; color:#cbd5e1; font-size:13px; margin-bottom:12px;"></div>
      <button class="big primary" id="batchFinishBtn" style="max-width:none; width:100%;" disabled>📸 사진 찍고 전체 전송</button>
    </div>
  </div>

  <!-- 1-b. 수동입력 화면 -->
  <div class="screen" id="manualScreen">
    <div style="font-size:15px; font-weight:700; margin-bottom:10px;">업체명을 입력해주세요</div>
    <input type="text" id="manualCompanyInput" placeholder="예: 유라타임" style="width:100%; max-width:280px; padding:14px; font-size:16px; border-radius:10px; border:1px solid #ccc; margin-bottom:12px;">
    <button class="big primary" id="manualSearchBtn" style="max-width:260px;">검색하기</button>
    <button class="big ghost" id="manualBackBtn" style="max-width:260px;">뒤로</button>
    <div id="manualResultList" style="width:100%; max-width:320px; margin-top:16px;"></div>
  </div>

  <!-- 2. 확인 화면 -->
  <div class="screen" id="confirmScreen">
    <div class="confirm-card">
      <div class="company" id="confirmCompany">-</div>
      <div class="bags" id="confirmSpTag" style="font-weight:800;">-</div>
      <div class="bags" id="confirmZoneWrap" style="display:none;">배송구역: <b id="confirmZone">-</b></div>
      <div class="bags">총 <b id="confirmBags">-</b> 봉투/박스</div>
    </div>
    <button class="big primary" id="toCapturebtn" style="max-width:260px;">📸 사진 촬영하기</button>
    <button class="big ghost" id="rescanBtn" style="max-width:260px;">다시 스캔</button>
  </div>
  <input type="file" id="cameraInput" accept="image/*,android/allowCamera" style="position:absolute; left:-9999px; width:1px; height:1px; opacity:0; overflow:hidden;">

  <!-- 4. 미리보기/전송 화면 -->
  <div class="screen" id="previewScreen">
    <img id="previewImg" alt="촬영된 사진">
    <div class="preview-actions">
      <button class="big ghost" id="retakeBtn">다시 찍기</button>
      <button class="big primary" id="sendBtn">전송</button>
    </div>
    <div id="sendOverlay" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.65); flex-direction:column; align-items:center; justify-content:center; gap:12px; color:#fff;">
      <div style="width:40px; height:40px; border:4px solid rgba(255,255,255,0.3); border-top-color:#FFB200; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
      <div style="font-size:15px; font-weight:700;">전송 중입니다...</div>
    </div>
  </div>

  <!-- 5. 전송완료 화면 -->
  <div class="screen" id="doneScreen">
    <div class="done-check">✅</div>
    <div class="done-title" id="doneTitle">배송완료 기록됐습니다</div>
    <div class="done-sub" id="doneInfo">-</div>
    <div id="statsBlock" style="display:none; width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin:6px 0; text-align:left; font-size:14px;"></div>
    <button class="big primary" id="nextBtn" style="max-width:260px;">다음 배송지 스캔</button>
  </div>
</div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-card">
    <h3>구글시트 연동 주소 설정</h3>
    <input type="text" id="gasUrlInput" placeholder="Apps Script 웹앱 URL (…/exec)">
    <button class="big primary" id="saveSettingsBtn" style="width:100%; max-width:none;">저장</button>
  </div>
</div>

<script>
let gasUrl = localStorage.getItem('deliveryGasUrl') || '';
let currentCompany = '';
let currentBags = '';
let currentZone = '';
let currentSpTag = '정식';
let manualDocumentKey = ''; // 수동입력으로 고른 경우, 정확한 매칭을 위한 전표번호
let captureStream = null;
let capturedDataUrl = '';
let pendingMode = 'delivery'; // 'delivery' | '상차전' | '상차후' | '출발' | '도착'
let batchMode = false;
let batchList = []; // [{company, zone, bagCount}, ...] 여러 업체 한 곳 모드에서 쌓이는 목록

// ⚠️ 스캐너버전: QrScanner(카메라) 관련 초기화는 없음. 아래에서 전역 키보드 리스너로 대체.

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderBatchList(){
  document.getElementById('batchCount').textContent = batchList.length;
  document.getElementById('batchListArea').innerHTML = batchList
    .map(item => `${item.company}${item.zone ? ' · ' + item.zone : ''}`)
    .map(t => `<div>• ${t}</div>`).join('');
  document.getElementById('batchFinishBtn').disabled = batchList.length === 0;
}

// 화면을 어디로 이동하든, 이전 세션(다중스캔 목록/모드/전송종류)이 남아서 다음 스캔에
// 잘못 영향을 주지 않도록 상태를 확실하게 초기화한다.
function resetSessionState(){
  batchMode = false;
  batchList = [];
  pendingMode = 'delivery';
  currentCompany = ''; currentBags = ''; currentZone = '';
  capturedDataUrl = '';
  renderBatchList();
  document.getElementById('batchPanel').style.display = 'none';
}

/* ---------- 0. 홈 화면 ---------- */
document.getElementById('homeBtn').addEventListener('click', ()=>{
  resetSessionState();
  showScreen('homeScreen');
});
document.getElementById('goToScanBtn').addEventListener('click', ()=>{
  resetSessionState();
  document.getElementById('scanStartLabel').textContent = '라벨의 바코드를 스캐너로 찍어주세요';
  showScreen('scanScreen');
});
document.getElementById('goToBatchScanBtn').addEventListener('click', ()=>{
  resetSessionState();
  batchMode = true;
  document.getElementById('batchPanel').style.display = 'block';
  document.getElementById('scanStartLabel').textContent = '이 장소에 있는 업체들의 바코드를 연달아 스캔해주세요';
  showScreen('scanScreen');
});
document.querySelectorAll('.milestone-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    pendingMode = btn.dataset.milestone;
    document.getElementById('cameraInput').click();
  });
});
document.getElementById('dongdaemunEndBtn').addEventListener('click', async ()=>{
  if(!gasUrl){
    alert('먼저 오른쪽 위 ⚙️ 에서 구글시트 연동 주소를 설정해주세요.');
    return;
  }
  try{
    const resp = await fetch(gasUrl, { method:'POST', body: JSON.stringify({ type:'dongdaemun_end' }) });
    let result = {};
    try{ result = await resp.json(); }catch(e){}
    alert('동대문 배송 종료 기록됐습니다.\n소요시간: ' + (result.elapsed || '계산 불가 (오늘 배송 기록 없음)'));
  }catch(err){
    alert('기록에 실패했습니다: ' + err.message);
  }
});

/* ---------- 설정 ---------- */
document.getElementById('settingsBtn').addEventListener('click', ()=>{
  document.getElementById('gasUrlInput').value = gasUrl;
  document.getElementById('settingsOverlay').classList.add('show');
});
document.getElementById('saveSettingsBtn').addEventListener('click', ()=>{
  gasUrl = document.getElementById('gasUrlInput').value.trim();
  localStorage.setItem('deliveryGasUrl', gasUrl);
  document.getElementById('settingsOverlay').classList.remove('show');
});

/* ---------- 1. 스캐너 입력 (하드웨어 바코드 스캐너 = 초고속 키보드 타이핑처럼 들어옴) ---------- */

// 한/영키가 한글로 되어있어도 스캐너 내용이 깨지지 않도록, 검수프로그램에서 검증된 것과
// 똑같은 두벌식 역변환 로직을 그대로 재사용한다.
const HANGUL_CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const HANGUL_JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const HANGUL_JONG = ['', 'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const HANGUL_KEY_MAP = {
  'ㄱ':'r','ㄲ':'R','ㄴ':'s','ㄷ':'e','ㄸ':'E','ㄹ':'f','ㅁ':'a','ㅂ':'q','ㅃ':'Q','ㅅ':'t','ㅆ':'T','ㅇ':'d','ㅈ':'w','ㅉ':'W','ㅊ':'c','ㅋ':'z','ㅌ':'x','ㅍ':'v','ㅎ':'g',
  'ㅏ':'k','ㅐ':'o','ㅑ':'i','ㅒ':'O','ㅓ':'j','ㅔ':'p','ㅕ':'u','ㅖ':'P','ㅗ':'h','ㅘ':'hk','ㅙ':'ho','ㅚ':'hl','ㅛ':'y','ㅜ':'n','ㅝ':'nj','ㅞ':'np','ㅟ':'nl','ㅠ':'b','ㅡ':'m','ㅢ':'ml','ㅣ':'l',
  'ㄳ':'rt','ㄵ':'sw','ㄶ':'sg','ㄺ':'rf','ㄻ':'fa','ㄼ':'fq','ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg','ㅄ':'qt',
};
function hangulToEnglish(str){
  let result = '';
  for(const ch of str){
    const code = ch.codePointAt(0);
    if(code >= 0xAC00 && code <= 0xD7A3){
      const offset = code - 0xAC00;
      const choIdx = Math.floor(offset / (21*28));
      const jungIdx = Math.floor((offset % (21*28)) / 28);
      const jongIdx = offset % 28;
      result += HANGUL_KEY_MAP[HANGUL_CHO[choIdx]] || '';
      result += HANGUL_KEY_MAP[HANGUL_JUNG[jungIdx]] || '';
      if(jongIdx > 0) result += HANGUL_KEY_MAP[HANGUL_JONG[jongIdx]] || '';
    } else if(HANGUL_KEY_MAP[ch]){
      result += HANGUL_KEY_MAP[ch];
    } else {
      result += ch;
    }
  }
  return result;
}
function containsHangul(str){
  return /[\u3131-\u318E\uAC00-\uD7A3]/.test(str);
}

// 스캐너는 사람이 초고속으로 타이핑하는 것처럼 키 입력을 보낸다. 특정 입력창에 포커스가
// 있을 필요 없이, 페이지 전체(document)에서 키를 감지해서 직접 버퍼에 모은다.
// 단, 사람이 의도적으로 다른 입력창(예: 수동입력 업체명 검색창)에 타이핑 중일 때는
// 그 타이핑까지 스캐너 입력으로 착각하면 안 되므로, 그럴 땐 이 리스너가 조용히 비켜준다.
let scanBuffer = '';
let scanBufferLastKeyTime = 0;
const SCAN_BUFFER_RESET_MS = 300; // 이 시간보다 오래 끊기면 "새로운 스캔 시작"으로 간주해 버퍼를 비움

function isTypingInOwnInput(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA';
}

document.addEventListener('keydown', (e)=>{
  if(isTypingInOwnInput()) return; // 수동입력 등 다른 입력창에 타이핑 중이면 절대 끼어들지 않음
  if(!document.getElementById('scanScreen').classList.contains('active')) return; // 스캔 화면일 때만 반응

  const now = Date.now();
  if(now - scanBufferLastKeyTime > SCAN_BUFFER_RESET_MS) scanBuffer = '';
  scanBufferLastKeyTime = now;

  if(e.key === 'Enter'){
    e.preventDefault();
    const raw = scanBuffer.trim();
    scanBuffer = '';
    if(raw) onScanDetected(raw);
  } else if(e.key.length === 1){
    scanBuffer += e.key;
  }
});

// 배송 QR/바코드 내용을 해석한다. 형식: DLV|업체명|배송구역|봉투수|S-P여부
// (예전 형식들도 계속 인식되게 하위호환 유지)
function tryParseDeliveryQrRaw(raw){
  if(raw.startsWith('DLV|')){
    const parts = raw.split('|');
    return { c: parts[1] || '', z: parts[2] || '', n: parts[3] || '', sp: parts[4] || '정식' };
  }
  try{
    const obj = JSON.parse(raw);
    if(obj && obj.t === 'delivery') return { c: obj.c || '', z: obj.z || '', n: obj.n || '', sp: '정식' };
  }catch(err){ /* JSON도 아니면 배송 QR이 아닌 것 */ }
  return null;
}

// 배송 QR엔 업체명이 원래부터 한글로 정상적으로 들어있으므로, 무조건 한글→영문 변환을 걸면
// 정상적인 업체명까지 깨뜨려버린다. 그래서 "있는 그대로 먼저 해석 시도" → "그게 실패하고,
// 한글이 섞여있을 때만" 한/영키 오타로 의심해서 되돌려보는 순서로 처리한다.
function parseDeliveryQr(text){
  const raw = String(text || '').trim();

  const direct = tryParseDeliveryQrRaw(raw);
  if(direct) return direct;

  if(containsHangul(raw)){
    const reversed = hangulToEnglish(raw);
    const viaReversed = tryParseDeliveryQrRaw(reversed);
    if(viaReversed) return viaReversed;
  }
  return null;
}

function onScanDetected(text){
  const debugEl = document.getElementById('scanDebugBox');
  const raw = String(text || '').trim();
  if(debugEl) debugEl.textContent = '최근 인식: ' + raw;

  const payload = parseDeliveryQr(raw);

  if(!payload){
    if(debugEl) debugEl.textContent = '읽음(배송 바코드 아님): ' + raw.slice(0, 60);
    return;
  }

  if(batchMode){
    // 여러 업체 한 곳 모드: 목록에 추가만 하고 계속 스캔 대기 상태를 유지한다
    const company = payload.c || '업체명 미확인';
    const alreadyAdded = batchList.some(item => item.company === company);
    if(alreadyAdded){
      if(debugEl) debugEl.textContent = `이미 추가됨: ${company}`;
      return;
    }
    batchList.push({ company, zone: payload.z || '', bagCount: payload.n || '', spTag: payload.sp || '정식' });
    renderBatchList();
    if(debugEl) debugEl.textContent = `✅ 추가됨: ${company} (계속 스캔하거나 아래 버튼으로 마무리)`;
    return;
  }

  currentCompany = payload.c || '업체명 미확인';
  currentBags = payload.n || '';
  currentZone = payload.z || '';
  currentSpTag = payload.sp || '정식';
  document.getElementById('confirmCompany').textContent = currentCompany;
  document.getElementById('confirmBags').textContent = currentBags;
  const spEl = document.getElementById('confirmSpTag');
  if(spEl){
    spEl.textContent = currentSpTag === 'SP' ? '📦 샘플' : '✅ 정식주문';
    spEl.style.color = currentSpTag === 'SP' ? '#DC2626' : '#16A34A';
  }
  const zoneWrap = document.getElementById('confirmZoneWrap');
  if(currentZone){
    document.getElementById('confirmZone').textContent = currentZone;
    zoneWrap.style.display = '';
  } else {
    zoneWrap.style.display = 'none';
  }
  showScreen('confirmScreen');
}

function renderManualResults(results){
  const listEl = document.getElementById('manualResultList');
  if(results.length === 0){
    listEl.innerHTML = '<div style="color:#888; text-align:center; margin-top:10px;">오늘 아직 배송완료 안 된 건이 없습니다.</div>';
    return;
  }
  listEl.innerHTML = '';
  results.forEach(item => {
    const spLabel = item.spTag === 'SP' ? '📦 샘플' : '✅ 정식주문';
    const spColor = item.spTag === 'SP' ? '#DC2626' : '#16A34A';
    const btn = document.createElement('button');
    btn.className = 'big ghost';
    btn.style.cssText = 'max-width:none; width:100%; text-align:left; margin-bottom:8px;';
    btn.innerHTML = `<div style="font-weight:800; font-size:15px;">${item.company || '-'}</div><span style="color:${spColor}; font-weight:800;">${spLabel}</span><br><span style="font-size:13px;">전표: ${item.documentKey || '-'} · 봉투 ${item.bagCount || '-'}개</span>`;
    btn.addEventListener('click', ()=>{
      currentCompany = item.company || '';
      currentBags = item.bagCount || '';
      currentZone = '';
      currentSpTag = item.spTag || '정식';
      manualDocumentKey = item.documentKey || '';
      document.getElementById('confirmCompany').textContent = currentCompany;
      document.getElementById('confirmBags').textContent = currentBags;
      const spEl = document.getElementById('confirmSpTag');
      if(spEl){
        spEl.textContent = currentSpTag === 'SP' ? '📦 샘플' : '✅ 정식주문';
        spEl.style.color = currentSpTag === 'SP' ? '#DC2626' : '#16A34A';
      }
      document.getElementById('confirmZoneWrap').style.display = 'none';
      showScreen('confirmScreen');
    });
    listEl.appendChild(btn);
  });
}

document.getElementById('manualSearchBtn').addEventListener('click', async ()=>{
  const company = document.getElementById('manualCompanyInput').value.trim();
  const listEl = document.getElementById('manualResultList');
  if(!company){ alert('업체명을 입력해주세요.'); return; }
  if(!gasUrl){ alert('먼저 오른쪽 위 ⚙️ 에서 구글시트 연동 주소를 설정해주세요.'); return; }
  listEl.innerHTML = '<div style="text-align:center; margin-top:10px;">검색 중...</div>';

    const result = await resp.json();
    if(!result.ok){

document.getElementById('cameraInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    resizeImage(evt.target.result, 720, 0.5).then(resizedDataUrl=>{
      capturedDataUrl = resizedDataUrl;
      document.getElementById('previewImg').src = capturedDataUrl;
      showScreen('previewScreen');
    });
  };
  reader.readAsDataURL(file);
  e.target.value = ''; // 같은 파일을 다시 찍어도 change 이벤트가 다시 발생하도록 초기화
});

// 요즘 폰 카메라 원본은 용량이 너무 커서 전송이 오래 걸리므로, 긴 변 기준으로 축소 + 압축해서
// 전송 속도를 확 줄인다 (배송완료 증빙용이라 이 정도 화질이면 충분함)
function resizeImage(dataUrl, maxSize, quality){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      let { width, height } = img;
      if(width > height && width > maxSize){
        height = Math.round(height * (maxSize / width));
        width = maxSize;
      } else if(height >= width && height > maxSize){
        width = Math.round(width * (maxSize / height));
        height = maxSize;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=> resolve(dataUrl); // 혹시 실패하면 원본이라도 그대로 사용
    img.src = dataUrl;
  });
}


document.getElementById('sendBtn').addEventListener('click', ()=>{
  if(!gasUrl){
    alert('먼저 오른쪽 위 ⚙️ 에서 구글시트 연동 주소를 설정해주세요.');
    return;
  }
  const isBatch = pendingMode === 'batch';
  const isMilestone = !isBatch && pendingMode !== 'delivery';
  const isManual = !isBatch && !isMilestone && !!manualDocumentKey;
  const payload = isBatch
    ? { type:'batchDelivery', companies: batchList, image: capturedDataUrl }
    : isMilestone
    ? { type:'milestone', milestoneType: pendingMode, image: capturedDataUrl }
    : isManual
    ? { type:'manualDeliveryComplete', company: currentCompany, documentKey: manualDocumentKey, bagCount: currentBags, image: capturedDataUrl }
    : { type:'delivery', company: currentCompany, zone: currentZone, bagCount: currentBags, spTag: currentSpTag, image: capturedDataUrl };
  manualDocumentKey = ''; // 한 번 쓰고 나면 다음 스캔에 영향 안 주도록 비움

  // 서버(드라이브 업로드+시트 기록) 처리를 기다리지 않고, 화면은 바로 완료로 넘어간다.
  // (기다리는 시간을 최대한 줄이기 위함 - 실제 업로드는 백그라운드에서 계속 진행됨)
  const nowText = new Date().toLocaleString('ko-KR');
  document.getElementById('doneInfo').textContent = isBatch
    ? `${batchList.length}개 업체 일괄 전송 중... (${nowText})`
    : isMilestone
    ? `${pendingMode} 사진 전송 중... (${nowText})`
    : `${currentCompany} · ${currentBags}봉투 · 전송 중... (${nowText})`;
  document.getElementById('statsBlock').style.display = 'none';
  showScreen('doneScreen');

  fetch(gasUrl, { method:'POST', body: JSON.stringify(payload) })
    .then(resp => resp.json())
    .then(result => {
      // 아직 완료화면에 머물러 있으면(다음 배송지로 안 넘어갔으면) 정확한 서버 시각으로 갱신
      if(document.getElementById('doneScreen').classList.contains('active')){
        if(isBatch){
          document.getElementById('doneInfo').textContent =
            `${batchList.map(b=>b.company).join(', ')} · 총 ${batchList.length}개 업체 · ${result.deliveryTime || nowText}`;
        } else {
          document.getElementById('doneInfo').textContent = isMilestone
            ? `${pendingMode} 사진 기록됨 · ${result.recordedTime || nowText}` + (result.elapsed ? ` · 소요시간: ${result.elapsed}` : '')
            : `${currentCompany} · ${currentBags}봉투 · ${result.deliveryTime || nowText}`;

          if(isMilestone && pendingMode === '도착' && result.stats){
            renderArrivalStats(result.stats);
          }
        }
      }
      if(isBatch){ batchList = []; renderBatchList(); }
    })
    .catch(err => {
      console.error('전송 실패:', err);
      alert('방금 건 전송에 실패했을 수 있습니다: ' + err.message + '\n\n인터넷 연결 확인 후 이 화면을 다시 캡처해서 알려주세요.');
    });
});

// "도착" 시 서버가 계산해준 하루 통계를 화면에 정리해서 보여준다
function renderArrivalStats(stats){
  const block = document.getElementById('statsBlock');
  const dd = stats.dongdaemun;
  let html = `
    <div style="font-weight:800; margin-bottom:8px; color:var(--navy);">📊 오늘 배송 통계</div>
    <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>배송건수 / 봉지수</span><b>${stats.totalDeliveries}건 · ${stats.totalBags}봉</b></div>
    <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>업체간 평균소요시간(전체)</span><b>${stats.avgBetweenAll || '-'}</b></div>
  `;
  if(dd){
    html += `
    <div style="border-top:1px dashed var(--line); margin:8px 0;"></div>
    <div style="font-weight:800; margin-bottom:6px; color:var(--accent);">🚩 동대문 구간</div>
    <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>동대문 총소요시간</span><b>${dd.totalElapsed || '-'}</b></div>
    <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>동대문 업체간 평균소요시간</span><b>${dd.avgBetween || '-'}</b></div>
    <div style="display:flex; justify-content:space-between;"><span>동대문 업체수 / 봉지수</span><b>${dd.companyCount}곳 · ${dd.bagCount}봉</b></div>
    `;
  }
  block.innerHTML = html;
  block.style.display = 'block';
}

/* ===================== 카톡 자동발송 실패 알림 (어느 화면에 있든 주기적으로 확인) ===================== */
let pendingFailRows = [];

async function checkFailedSends(){
  if(!gasUrl) return;
  try{
    const resp = await fetch(gasUrl + '?action=getFailedSends');
    const result = await resp.json();
    if(result.ok && Array.isArray(result.list) && result.list.length > 0){
      pendingFailRows = result.list.map(item => item.row);
      const listEl = document.getElementById('failNoticeList');
      listEl.innerHTML = result.list
        .map(item => `• ${item.time} — <b>${item.company}</b><br>&nbsp;&nbsp;${item.reason || ''}`)
        .join('<br>');
      document.getElementById('failNoticeOverlay').style.display = 'flex';
    }
  }catch(err){
    console.warn('실패 알림 확인 중 오류:', err);
  }
}

document.getElementById('failNoticeAckBtn').addEventListener('click', async ()=>{
  document.getElementById('failNoticeOverlay').style.display = 'none';
  if(!gasUrl || pendingFailRows.length === 0) return;
  try{
    await fetch(gasUrl, {
      method:'POST',
      body: JSON.stringify({ type:'acknowledgeFailedSends', rows: pendingFailRows }),
    });
  }catch(err){
    console.warn('실패 알림 확인 처리 중 오류:', err);
  }
  pendingFailRows = [];
});

// 앱을 켤 때 한 번 바로 확인 + 그 이후로는 1분마다 계속 확인 (지금 어느 화면에 있든 상관없이 동작)
checkFailedSends();
setInterval(checkFailedSends, 5000);
