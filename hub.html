<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도매물류팀 업무 프로그램</title>
<style>
  :root{
    --bg: #FFFFFF;
    --panel: #F5F6FB;
    --panel2: #ECEEF7;
    --line: #DCE0EE;
    --text: #171B3D;
    --sub: #6C7293;
    --accent: #FFB200;
    --accent-ink: #1A1300;
    --btn-hover: #E7E9F5;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:24px 16px 60px;
    background:var(--panel); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
  }
  .wrap{ max-width:720px; margin:0 auto; }
  h1{ text-align:center; font-size:22px; margin:8px 0 28px; }
  .section-title{
    font-size:13px; color:var(--sub); font-weight:700; margin:0 0 10px 2px;
    display:flex; align-items:center; gap:6px;
  }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
    gap:12px; margin-bottom:28px;
  }
  .card{
    background:var(--bg); border:1px solid var(--line); border-radius:14px;
    padding:16px; position:relative; transition:background .15s;
  }
  .card:hover{ background:var(--btn-hover); }
  .card-main{
    display:block; text-decoration:none; color:var(--text);
  }
  .card-icon{ font-size:26px; margin-bottom:8px; }
  .card-label{ font-size:15px; font-weight:700; }
  .sheet-link{
    position:absolute; top:12px; right:14px; font-size:11px;
    color:var(--sub); text-decoration:none; display:flex; align-items:center; gap:3px;
    padding:3px 6px; border-radius:6px;
  }
  .sheet-link:hover{ background:var(--panel2); color:var(--text); }
  .sheet-link.disabled{ color:#C3C6D6; pointer-events:none; }
  footer{ text-align:center; font-size:12px; color:var(--sub); margin-top:20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📦 도매물류팀 업무 프로그램</h1>

  <div class="section-title">🖥️ 컴퓨터에서 쓰는 것</div>
  <div class="grid">
    <div class="card">
      <a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1rHMm5DXgMcpZ7I4VrWR_W3o5sLmnawU52O53hGVmRWQ/edit?gid=0#gid=0" target="_blank" rel="noopener">🔗 시트</a>
      <a class="card-main" href="https://naleechg5930-maker.github.io/delivery-app/inspect.html">
        <div class="card-icon">📋</div>
        <div class="card-label">검수프로그램</div>
      </a>
    </div>

    <div class="card">
      <a class="sheet-link" href="https://docs.google.com/spreadsheets/d/14KVYLlr8IuoV7kJi9vegi6BOl34DYaqXdrdbgGaUbus/edit?gid=1929791885#gid=1929791885" target="_blank" rel="noopener">🔗 시트</a>
      <a class="card-main" href="https://naleechg5930-maker.github.io/delivery-app/inbound.html">
        <div class="card-icon">📥</div>
        <div class="card-label">입고프로그램</div>
      </a>
    </div>

    <div class="card">
      <a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1FeWdEy18L-oMx2-X5RoP6q8kpi7UBWZecaJ2Xa02UqE/edit?gid=1238667466#gid=1238667466" target="_blank" rel="noopener">🔗 시트</a>
      <a class="card-main" href="https://naleechg5930-maker.github.io/delivery-app/inventory.html">
        <div class="card-icon">📊</div>
        <div class="card-label">재고조사프로그램</div>
      </a>
    </div>
  </div>

  <div class="section-title">📱 휴대폰에서 쓰는 것</div>
  <div class="grid">
    <div class="card">
      <a class="card-main" href="https://naleechg5930-maker.github.io/delivery-app/delivery.html">
        <div class="card-icon">📷</div>
        <div class="card-label">배송완료 확인 (카메라)</div>
      </a>
    </div>

    <div class="card">
      <a class="card-main" href="https://naleechg5930-maker.github.io/delivery-app/delivery2.html">
        <div class="card-icon">🔦</div>
        <div class="card-label">배송완료 확인 (스캐너)</div>
      </a>
    </div>
  </div>

  <div class="section-title">📑 참고용 시트</div>
  <div class="grid">
    <div class="card">
      <a class="card-main" href="https://docs.google.com/spreadsheets/d/1W2yMLOFhC_Qgex6suile0iMtj-Nm53yJMAa57nHa_04/edit?gid=1708883295#gid=1708883295" target="_blank" rel="noopener">
        <div class="card-icon">📈</div>
        <div class="card-label">물류작업시간분석</div>
      </a>
    </div>
  </div>

  <footer>이 화면 하나만 즐겨찾기 해두시면 됩니다</footer>
</div>
</body>
</html>
